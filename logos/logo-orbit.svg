<?xml version="1.0" encoding="UTF-8"?>
<!-- 星罗 · 轨道与点阵（简约风） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#e08a10"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="#0f0d24"/>

  <!-- Orbits -->
  <g fill="none" stroke="#f5b841" stroke-width="1.2">
    <ellipse cx="32" cy="32" rx="22" ry="10" opacity="0.6"/>
    <ellipse cx="32" cy="32" rx="10" ry="22" opacity="0.6" transform="rotate(0 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="10" opacity="0.4" transform="rotate(45 32 32)"/>
    <ellipse cx="32" cy="32" rx="22" ry="10" opacity="0.4" transform="rotate(-45 32 32)"/>
  </g>

  <!-- Core -->
  <circle cx="32" cy="32" r="5" fill="url(#core2)"/>
  <circle cx="32" cy="32" r="5" fill="none" stroke="#ffe9a8" stroke-width="0.6" opacity="0.7"/>

  <!-- Satellite stars -->
  <circle cx="54" cy="32" r="1.8" fill="#ffffff"/>
  <circle cx="10" cy="32" r="1.4" fill="#9ab3ff"/>
  <circle cx="32" cy="10" r="1.2" fill="#ffe9a8"/>
  <circle cx="32" cy="54" r="1.6" fill="#ffffff"/>
  <circle cx="47.5" cy="47.5" r="1.2" fill="#9ab3ff"/>
  <circle cx="16.5" cy="16.5" r="1" fill="#ffe9a8"/>
</svg>
