<?xml version="1.0" encoding="UTF-8"?>
<!-- 命盘网格 · 中心星 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1640"/>
      <stop offset="100%" stop-color="#0a0820"/>
    </linearGradient>
    <radialGradient id="coreStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#c87a0f"/>
    </radialGradient>
  </defs>

  <!-- Rounded square bg -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#f5b841" stroke-width="1.2" opacity="0.8"/>

  <!-- 4x4 grid lines -->
  <g stroke="#f5b841" stroke-width="0.8" opacity="0.35">
    <line x1="17" y1="8" x2="17" y2="56"/>
    <line x1="32" y1="8" x2="32" y2="24"/>
    <line x1="32" y1="40" x2="32" y2="56"/>
    <line x1="47" y1="8" x2="47" y2="56"/>
    <line x1="8" y1="17" x2="24" y2="17"/>
    <line x1="40" y1="17" x2="56" y2="17"/>
    <line x1="8" y1="32" x2="24" y2="32"/>
    <line x1="40" y1="32" x2="56" y2="32"/>
    <line x1="8" y1="47" x2="24" y2="47"/>
    <line x1="40" y1="47" x2="56" y2="47"/>
  </g>

  <!-- Center glyph: 4-point star -->
  <g transform="translate(32 32)">
    <circle r="10" fill="url(#coreStar)"/>
    <path d="M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3 Z"
      fill="#ffe9a8" opacity="0.9"/>
    <circle r="3" fill="#0a0820"/>
  </g>

  <!-- Corner star dots -->
  <circle cx="12" cy="12" r="1.2" fill="#ffe9a8"/>
  <circle cx="52" cy="12" r="1.2" fill="#ffe9a8"/>
  <circle cx="12" cy="52" r="1.2" fill="#ffe9a8"/>
  <circle cx="52" cy="52" r="1.2" fill="#ffe9a8"/>
</svg>
