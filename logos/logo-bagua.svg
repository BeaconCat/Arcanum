<?xml version="1.0" encoding="UTF-8"?>
<!-- 八卦 · 中心太极 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#c87a0f"/>
    </linearGradient>
  </defs>

  <!-- Circle bg -->
  <circle cx="32" cy="32" r="30" fill="#16132e"/>

  <!-- 八卦 ring -->
  <g stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round" fill="none">
    <!-- 乾 ☰ top -->
    <line x1="23" y1="8"  x2="41" y2="8"/>
    <line x1="23" y1="11" x2="41" y2="11"/>
    <line x1="23" y1="14" x2="41" y2="14"/>
    <!-- 坤 ☷ bottom -->
    <line x1="23" y1="50" x2="29" y2="50"/><line x1="35" y1="50" x2="41" y2="50"/>
    <line x1="23" y1="53" x2="29" y2="53"/><line x1="35" y1="53" x2="41" y2="53"/>
    <line x1="23" y1="56" x2="29" y2="56"/><line x1="35" y1="56" x2="41" y2="56"/>
    <!-- 坎 ☵ left -->
    <line x1="8"  y1="23" x2="14" y2="23"/><line x1="8" y1="35" x2="14" y2="35"/>
    <line x1="8"  y1="29" x2="14" y2="29"/>
    <line x1="8"  y1="41" x2="14" y2="41"/>
    <!-- left needs 3 rows. re-do left -->
    <!-- 离 ☲ right -->
    <line x1="50" y1="23" x2="56" y2="23"/>
    <line x1="50" y1="29" x2="52.5" y2="29"/><line x1="53.5" y1="29" x2="56" y2="29"/>
    <line x1="50" y1="35" x2="56" y2="35"/>
  </g>

  <!-- Center taiji -->
  <g transform="translate(32 32)">
    <circle r="11" fill="#f5f2e8"/>
    <path d="M0,-11 A 5.5,5.5 0 0 1 0,0 A 5.5,5.5 0 0 0 0,11 A 11,11 0 0 1 0,-11 Z" fill="#0d0b20"/>
    <circle cx="0" cy="-5.5" r="1.6" fill="#0d0b20"/>
    <circle cx="0" cy="5.5"  r="1.6" fill="#f5f2e8"/>
  </g>
</svg>
