<?xml version="1.0" encoding="UTF-8"?>
<!-- 北斗七星 · 天枢星为首（第一颗放大金色） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#2a2550"/>
      <stop offset="100%" stop-color="#0d0b20"/>
    </radialGradient>
    <radialGradient id="tianshu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="60%" stop-color="#f5b841"/>
      <stop offset="100%" stop-color="#c87a0f"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9ab3ff"/>
    </radialGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#f5b841" stroke-width="1" opacity="0.6"/>

  <!-- 北斗连线 -->
  <polyline points="16,20 24,16 32,18 38,26 32,32 40,36 48,40"
    fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- 六颗普通星 -->
  <circle cx="24" cy="16" r="1.8" fill="url(#star)"/>
  <circle cx="32" cy="18" r="1.8" fill="url(#star)"/>
  <circle cx="38" cy="26" r="1.8" fill="url(#star)"/>
  <circle cx="32" cy="32" r="1.8" fill="url(#star)"/>
  <circle cx="40" cy="36" r="1.8" fill="url(#star)"/>
  <circle cx="48" cy="40" r="1.8" fill="url(#star)"/>

  <!-- 天枢（金色突出） -->
  <circle cx="16" cy="20" r="4" fill="url(#tianshu)"/>
  <circle cx="16" cy="20" r="6.5" fill="none" stroke="#f5b841" stroke-width="0.8" opacity="0.6"/>
</svg>
